[project]
name = "upgrade-workbench"
version = "0.0.1"
description = "Evidence-backed dependency upgrade verification workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "unidiff>=0.7.5,<0.8",
    "markdown-it-py>=4,<5",
    "docutils>=0.21,<0.23",
    "ruff==0.16.7",
    "filelock>=3.20,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[project.scripts]
upgrade-workbench = "upgrade_workbench.cli:main"
upgrade-service = "upgrade_workbench.service.cli:main"

[project.optional-dependencies]
probe-generation = ["hypothesis==6.142.4"]
service = [
    "fastapi>=0.120,<1",
    "uvicorn>=0.35,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
]
retrieval = [
    "sentence-transformers>=5.1,<6",
    "torch==2.8.0",
]
retrieval-cuda = [
    "sentence-transformers>=5.1,<6",
    "torch==2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "retrieval", marker = "sys_platform != 'win32'" },
    { index = "pytorch-cu128", extra = "retrieval-cuda" },
]

[tool.uv]
conflicts = [[{ extra = "retrieval" }, { extra = "retrieval-cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["ALL"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "upgrade_workbench/_resources/uv.lock"
